services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calendar_backend
    restart: unless-stopped
    environment:
      # DB_HOST must now be the Private IP of the Ubuntu machine hosting the DB (or RDS Endpoint)
      DB_HOST: ${DB_HOST} 
      DB_USER: ${DB_USER:-calendar_user}
      DB_PASSWORD: ${DB_PASSWORD:-calendar_password}
      DB_NAME: ${DB_NAME:-calendar_app}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production_2026}
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    container_name: calendar_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - backend